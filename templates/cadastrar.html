{% extends "base.html" %}

{% block conteudo %}
<h1>Cadastrar Funcionário</h1>

<form action="{{ url_for('painel.processar_cadastro') }}" method="POST">
    <div class="campo">
        <label for="nome">Nome *</label>
        <input type="text" id="nome" name="nome" required placeholder="Ex: João Silva">
    </div>

    <div class="campo">
        <label for="uid_cartao">UID do Cartão RFID *</label>
        <input type="text" id="uid_cartao" name="uid_cartao" required
               placeholder="Ex: E7 45 D6 19" pattern="([0-9A-Fa-f]{2}\s?)+">
        <small>Formato: bytes em hexadecimal separados por espaço (ex: E7 45 D6 19)</small>
    </div>

    <div class="campo">
        <label for="cargo">Cargo</label>
        <input type="text" id="cargo" name="cargo" placeholder="Ex: Analista de Sistemas">
    </div>

    <div class="campo campo-checkbox">
        <input type="checkbox" id="ativo" name="ativo" checked>
        <label for="ativo">Funcionário ativo (tem permissão de acesso)</label>
    </div>

    <div class="acoes">
        <button type="submit">Cadastrar</button>
        <a href="{{ url_for('painel.index') }}">Cancelar</a>
    </div>
</form>
{% endblock %}
