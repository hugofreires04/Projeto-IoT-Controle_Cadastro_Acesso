{% extends "base.html" %}

{% block conteudo %}
<h1>Editar Funcionário</h1>

<form action="{{ url_for('processar_edicao', id=func.id) }}" method="POST">
    <div class="campo">
        <label for="nome">Nome *</label>
        <input type="text" id="nome" name="nome" required value="{{ func.nome }}">
    </div>

    <div class="campo">
        <label for="uid_cartao">UID do Cartão RFID *</label>
        <input type="text" id="uid_cartao" name="uid_cartao" required
               value="{{ func.uid_cartao }}" pattern="([0-9A-Fa-f]{2}\s?)+">
        <small>Formato: bytes em hexadecimal separados por espaço (ex: E7 45 D6 19)</small>
    </div>

    <div class="campo">
        <label for="cargo">Cargo</label>
        <input type="text" id="cargo" name="cargo" value="{{ func.cargo or '' }}">
    </div>

    <div class="campo campo-checkbox">
        <input type="checkbox" id="ativo" name="ativo" {% if func.ativo %}checked{% endif %}>
        <label for="ativo">Funcionário ativo (tem permissão de acesso)</label>
    </div>

    <div class="acoes">
        <button type="submit">Salvar Alterações</button>
        <a href="{{ url_for('index') }}">Cancelar</a>
    </div>
</form>
{% endblock %}
