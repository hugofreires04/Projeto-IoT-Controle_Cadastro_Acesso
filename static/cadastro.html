<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Funcionário — Controle de Acesso RFID</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <span class="nav-title">Controle de Acesso RFID</span>
    </nav>

    <main>
        <h1>Cadastro de funcionário via cartão RFID</h1>

        <form id="form-cadastro">
            <div class="campo">
                <label for="uid">UID do cartão</label>
                <input type="text" id="uid" readonly>
            </div>
            <div class="campo">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" required>
            </div>
            <div class="campo">
                <label for="cargo">Cargo</label>
                <input type="text" id="cargo">
            </div>
            <div class="campo">
                <label for="nivel">Nível de acesso ao sistema (opcional)</label>
                <select id="nivel">
                    <option value="">Sem acesso ao sistema</option>
                    <option value="operador">Operador</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <div class="campo">
                <label>Áreas permitidas</label>
                <div id="areas" class="areas-checkboxes"></div>
            </div>

            <div id="mensagem" class="flash" style="display:none;"></div>

            <div class="acoes">
                <button type="submit">Cadastrar</button>
            </div>
        </form>
    </main>

    <script src="js/auth.js"></script>
    <script>
        const uid = new URLSearchParams(window.location.search).get("uid") || "";
        document.getElementById("uid").value = uid;

        const mensagem = document.getElementById("mensagem");

        function mostrarMensagem(texto, classe) {
            mensagem.className = "flash " + classe;
            mensagem.textContent = texto;
            mensagem.style.display = "block";
        }

        if (!obterToken()) {
            mostrarMensagem("Você precisa estar logado como admin para concluir este cadastro. Faça login e escaneie o QR Code novamente.", "flash-erro");
            document.getElementById("form-cadastro").style.display = "none";
        }

        async function carregarAreas() {
            const resposta = await apiFetch("/api/areas");
            const areas = await resposta.json();
            document.getElementById("areas").innerHTML = areas.map((area) => `
                <label class="campo-checkbox">
                    <input type="checkbox" name="area" value="${area.id}"> ${area.nome}
                </label>
            `).join("") || "Nenhuma área cadastrada.";
        }

        if (obterToken()) carregarAreas();

        document.getElementById("form-cadastro").addEventListener("submit", async (evento) => {
            evento.preventDefault();

            const areasSelecionadas = Array.from(document.querySelectorAll('#areas input:checked')).map((el) => Number(el.value));

            const resposta = await apiFetch("/api/funcionarios", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    uid,
                    nome: document.getElementById("nome").value,
                    cargo: document.getElementById("cargo").value,
                    nivel_acesso: document.getElementById("nivel").value || null,
                    areas: areasSelecionadas,
                }),
            });
            const dados = await resposta.json();

            if (resposta.ok) {
                mostrarMensagem(`Funcionário "${dados.nome}" cadastrado com sucesso!`, "flash-sucesso");
                document.getElementById("form-cadastro").reset();
                document.getElementById("uid").value = uid;
            } else {
                mostrarMensagem(dados.erro || "Erro ao cadastrar.", "flash-erro");
            }
        });
    </script>
</body>
</html>
