<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Controle de Acesso RFID</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="pagina-login">
    <main class="login-container">
        <form id="form-login" class="login-box">
            <h1>Controle de Acesso RFID</h1>

            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required autofocus>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required>
            </div>

            <div id="mensagem-erro" class="flash flash-erro" style="display:none;"></div>

            <div class="acoes">
                <button type="submit">Entrar</button>
            </div>
        </form>
    </main>

    <script src="js/auth.js"></script>
    <script>
        const mensagemErro = document.getElementById("mensagem-erro");

        function mostrarErro(texto) {
            mensagemErro.textContent = texto;
            mensagemErro.style.display = "block";
        }

        async function tentarSessaoExistente() {
            if (!obterToken()) return;
            try {
                const resposta = await fetch("/api/me", { headers: { Authorization: "Bearer " + obterToken() } });
                if (!resposta.ok) { limparSessao(); return; }
                redirecionarPorNivel(obterNivel());
            } catch {
                limparSessao();
            }
        }

        function redirecionarPorNivel(nivel) {
            window.location.href = nivel === "admin" ? "/static/admin.html" : "/static/operador.html";
        }

        document.getElementById("form-login").addEventListener("submit", async (evento) => {
            evento.preventDefault();
            mensagemErro.style.display = "none";

            const email = document.getElementById("email").value.trim();
            const senha = document.getElementById("senha").value;

            const resposta = await fetch("/api/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, senha }),
            });

            const dados = await resposta.json();

            if (!resposta.ok) {
                mostrarErro(dados.erro || "Erro ao entrar.");
                return;
            }

            salvarSessao(dados);
            redirecionarPorNivel(dados.nivel);
        });

        tentarSessaoExistente();
    </script>
</body>
</html>
