# docker-compose.yml — sobe o container da aplicação Flask.
# O PostgreSQL/TimescaleDB e o broker MQTT são serviços remotos (ver .env),
# então este compose tem um único serviço.
#
# Como este arquivo vive em .devcontainer/, rode a partir da RAIZ do projeto:
#   docker compose -f .devcontainer/docker-compose.yml up --build
services:
  app:
    build:
      # O contexto é a raiz do repositório (..), para o COPY do Dockerfile
      # enxergar o código; o Dockerfile fica aqui dentro da pasta.
      context: ..
      dockerfile: .devcontainer/Dockerfile
    env_file:
      - ../.env
    ports:
      - "${FLASK_PORT:-5000}:${FLASK_PORT:-5000}"
    restart: unless-stopped
