<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Funcionário</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,.10);
      width: 100%;
      max-width: 480px;
      overflow: hidden;
    }

    .card-header {
      background: #1a56db;
      color: #fff;
      padding: 28px 32px 24px;
    }

    .card-header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: .01em;
    }

    .card-header p {
      margin-top: 4px;
      font-size: .875rem;
      opacity: .82;
    }

    .card-body {
      padding: 32px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: .875rem;
      font-weight: 500;
      color: #374151;
      margin-bottom: 6px;
    }

    label .required {
      color: #e02424;
      margin-left: 2px;
    }

    input, select {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: .9375rem;
      color: #111827;
      background: #fff;
      transition: border-color .15s, box-shadow .15s;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #1a56db;
      box-shadow: 0 0 0 3px rgba(26,86,219,.15);
    }

    input[readonly] {
      background: #f9fafb;
      color: #374151;
      cursor: default;
    }

    input[readonly]:focus {
      border-color: #d1d5db;
      box-shadow: none;
    }

    .uid-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .uid-row .form-group {
      flex: 1;
      margin-bottom: 0;
    }

    .btn-clear-uid {
      padding: 10px 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      background: #f9fafb;
      color: #6b7280;
      font-size: .875rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s, border-color .15s;
      height: 42px;
    }

    .btn-clear-uid:hover {
      background: #f3f4f6;
      border-color: #9ca3af;
      color: #374151;
    }

    .divider {
      border: none;
      border-top: 1px solid #e5e7eb;
      margin: 24px 0;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: #1a56db;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background .15s, transform .1s;
    }

    .btn-submit:hover { background: #1e429f; }
    .btn-submit:active { transform: scale(.99); }

    .btn-submit:disabled {
      background: #93c5fd;
      cursor: not-allowed;
      transform: none;
    }

    .toast {
      display: none;
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: .875rem;
      font-weight: 500;
    }

    .toast.success {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #6ee7b7;
    }

    .toast.error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .toast.visible { display: block; }

    .hint {
      font-size: .78rem;
      color: #9ca3af;
      margin-top: 4px;
    }

    .hint.aguardando { color: #9ca3af; }
    .hint.detectado  { color: #059669; font-weight: 500; }

    @keyframes blink { 50% { opacity: .4; } }
    .hint.aguardando { animation: blink 1.4s ease-in-out infinite; }
  </style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <h1>Cadastro de Funcionário</h1>
    <p>Preencha os dados do novo colaborador</p>
  </div>

  <div class="card-body">
    <form id="form-cadastro" novalidate>

      <!-- UID do cartão -->
      <div class="form-group">
        <label for="uid">UID do Cartão RFID <span class="required">*</span></label>
        <div class="uid-row">
          <div class="form-group">
            <input
              type="text"
              id="uid"
              name="uid"
              placeholder="Aproxime o cartão da catraca..."
              autocomplete="off"
              spellcheck="false"
              style="text-transform:uppercase"
              required
            />
          </div>
          <button type="button" class="btn-clear-uid" id="btn-clear-uid" title="Limpar UID">Limpar</button>
        </div>
        <p class="hint aguardando" id="uid-status">Aguardando leitura do cartão...</p>
      </div>

      <hr class="divider" />

      <!-- Nome completo -->
      <div class="form-group">
        <label for="nome">Nome Completo <span class="required">*</span></label>
        <input type="text" id="nome" name="nome" placeholder="Nome do funcionário" autocomplete="name" required />
      </div>

      <!-- Cargo -->
      <div class="form-group">
        <label for="cargo">Cargo <span class="required">*</span></label>
        <select id="cargo" name="cargo" required>
          <option value="" disabled selected>Selecione o cargo</option>
          <option value="caixa">Caixa</option>
          <option value="repositor">Repositor(a)</option>
          <option value="seguranca">Segurança</option>
          <option value="supervisor">Supervisor(a)</option>
          <option value="gerente">Gerente</option>
          <option value="administrador">Administrador(a)</option>
        </select>
      </div>

      <!-- Setor -->
      <div class="form-group">
        <label for="setor">Setor</label>
        <input type="text" id="setor" name="setor" placeholder="Ex: Frente de Caixa, Estoque..." />
      </div>

      <button type="submit" class="btn-submit" id="btn-submit">Cadastrar Funcionário</button>

      <div id="toast" class="toast" role="alert" aria-live="polite"></div>
    </form>
  </div>
</div>

<script>
  const API_ENDPOINT = '/api/funcionarios'; // ajuste conforme o backend

  function showToast(msg, type) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = `toast ${type} visible`;
    setTimeout(() => { el.className = 'toast'; }, 5000);
  }

  // Polling: consulta /uid a cada 2s para detectar novo cartão escaneado
  (function iniciarPolling() {
    const campo = document.getElementById('uid');
    const status = document.getElementById('uid-status');

    const intervalo = setInterval(async () => {
      // Não sobrescreve UID que o usuário já preencheu manualmente
      if (campo.readOnly) return;

      try {
        const res = await fetch('/uid');
        const data = await res.json();
        if (data.uid && data.uid.trim() !== '') {
          clearInterval(intervalo);
          campo.value = data.uid.trim().toUpperCase();
          campo.readOnly = true;
          status.textContent = 'Cartão detectado automaticamente.';
          status.className = 'hint detectado';
          showToast('Cartão RFID detectado! Preencha os dados.', 'success');
          document.getElementById('nome').focus();
        }
      } catch (_) {
        // silencioso — sem conexão ainda
      }
    }, 2000);
  })();

  document.getElementById('btn-clear-uid').addEventListener('click', function () {
    const campo = document.getElementById('uid');
    const status = document.getElementById('uid-status');
    campo.value = '';
    campo.readOnly = false;
    status.textContent = 'Aguardando leitura do cartão...';
    status.className = 'hint aguardando';
    campo.focus();
  });

  // Formata UID enquanto digita (grupos de 2 hex separados por espaço)
  document.getElementById('uid').addEventListener('input', function () {
    if (this.readOnly) return;
    let raw = this.value.replace(/[^0-9a-fA-F]/g, '').toUpperCase();
    let formatted = raw.match(/.{1,2}/g)?.join(' ') ?? '';
    this.value = formatted;
  });

  document.getElementById('form-cadastro').addEventListener('submit', async function (e) {
    e.preventDefault();

    const uid   = document.getElementById('uid').value.trim();
    const nome  = document.getElementById('nome').value.trim();
    const cargo = document.getElementById('cargo').value;
    const setor = document.getElementById('setor').value.trim();

    if (!uid || !nome || !cargo) {
      showToast('Preencha os campos obrigatórios (UID, Nome e Cargo).', 'error');
      return;
    }

    const btn = document.getElementById('btn-submit');
    btn.disabled = true;
    btn.textContent = 'Cadastrando...';

    try {
      const res = await fetch(API_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ uid, nome, cargo, setor }),
      });

      if (res.ok) {
        showToast(`Funcionário "${nome}" cadastrado com sucesso!`, 'success');
        this.reset();
        const campo = document.getElementById('uid');
        campo.readOnly = false;
        document.getElementById('uid-status').textContent = 'Aguardando leitura do cartão...';
        document.getElementById('uid-status').className = 'hint aguardando';
      } else {
        const data = await res.json().catch(() => ({}));
        showToast(data.mensagem ?? `Erro ao cadastrar (HTTP ${res.status}).`, 'error');
      }
    } catch (err) {
      showToast('Não foi possível conectar ao servidor. Verifique a rede.', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Cadastrar Funcionário';
    }
  });
</script>

</body>
</html>
