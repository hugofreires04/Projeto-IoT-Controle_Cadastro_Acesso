<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login Admin</title>
    <style>
        body {
            font-family: Arial;
            max-width: 400px;
            margin: 60px auto;
        }


        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }


        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background: #1976d2;
            color: white;
            border: none;
        }


        .erro {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>
<body>


<h2>Login Admin</h2>


<form action="/auth" method="POST">


    <input type="text" name="usuario" placeholder="Usuário" required>


    <input type="password" name="senha" placeholder="Senha" required>


    <button type="submit">Entrar</button>


</form>
</body>
</html>
